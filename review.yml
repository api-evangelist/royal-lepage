actions:
  apisListed: 0
  apisYmlUpdated: true
  openapiHarvested: false
  reason: |
    apis[] is intentionally EMPTY. Listing an API here would require inventing
    one. No documented endpoint, base URL, spec, or auth scheme is published by
    Royal LePage. The correct record of this organization is its identity, its
    place in the Canadian value chain, and the precise shape of the closure -
    licensed DDF data displayed under a VOW agreement, with automated access
    contractually forbidden.
