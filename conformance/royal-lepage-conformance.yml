summary: |
  Royal LePage conforms to no machine-readable API standard, because it publishes
  no API. This file records the negative result explicitly - and the reason, which
  is structural rather than an oversight. Canadian residential listing syndication
  runs through one national cooperative (CREA) and its Data Distribution Facility,
  not through the ~500 US MLSs that RESO certification is organised around. Royal
  LePage is a brokerage/franchisor and a DDF LICENSEE, so it consumes the standard
  contract rather than publishing or certifying one.
standards:
- id: reso-web-api
  conforms: false
  evidence: No RESO Web API endpoint, no OData service document, no $metadata (404
    at https://www.royallepage.ca/$metadata). No entry in the RESO certification directory.
- id: reso-data-dictionary
  conforms: false
  evidence: No RESO Data Dictionary certification at any version (1.7 or 2.0); zero
    occurrences of "RESO", "Data Dictionary", or "UPI" in a site-wide content scan.
- id: odata-v4
  conforms: false
  evidence: No OData service root or $metadata document served on any host.
- id: openapi
