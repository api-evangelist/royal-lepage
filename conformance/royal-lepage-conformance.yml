- id: crea-ddf
  conforms: false
  role: consumer
  evidence: 'Site states its inventory is served "via the CREA DDF network" and the
    footer attributes property information to "the Canadian Real Estate Association''s
    Data Distribution Facility (DDF)". Royal LePage displays DDF data as a licensee;
    the DDF Web API, its schema, and its access rules belong to CREA. Programmatic
    access to the underlying record is obtained from CREA under REALTOR/CREA membership
    or an authorised technology-provider arrangement - never from Royal LePage.'
- id: vow-idx
  conforms: true
  role: operator
  evidence: 'Legal notice: "Registering an account creates a Virtual Office Website
    (VOW) relationship between Royal LePage Real Estate Services, Brokerage and the
    Registrant," restricting data to "personal, non-commercial use". This is a CREA/board
    display regime, not an API standard, and it forbids automated access outright.'
